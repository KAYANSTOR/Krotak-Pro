name: net_app
description: Krotak Pro — نظام عربي لإدارة بيع كروت الإنترنت والتحويلات عبر SMS، يعمل محليًا أولاً (Flutter).
publish_to: "none"
version: 1.0.14+14

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  drift: ^2.22.0
  sqlite3_flutter_libs: ^0.5.24
  path: ^1.9.0
  path_provider: ^2.1.4
  flex_color_scheme: ^8.0.0
  permission_handler: ^11.3.1
  cryptography: ^2.7.0
  file_picker: ^10.3.10
  url_launcher: ^6.3.0
  pdf: ^3.11.3
  share_plus: ^10.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  drift_dev: ^2.22.0

flutter:
  uses-material-design: true
  # الأيقونة مصدرها نص Base64 صغير ويُفك ترميزه داخل واجهة «عن التطبيق».
  # في CI يُستعاد منه PNG قبل بناء Android.
  assets:
    - assets/icon/krotak_icon.b64
    - assets/fonts/Tajawal-Regular.ttf
    - assets/fonts/Tajawal-Bold.ttf

  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
          weight: 400
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
        - asset: assets/fonts/Tajawal-ExtraBold.ttf
          weight: 800
