name: Fix inventory header RTL
on:
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/fix_inventory_header.py
      - run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lib/ui/screens/inventory_widgets.dart
          git diff --staged --quiet && echo nochange && exit 0
          git commit -m "fix(inventory): RTL header — title on right, icons on left"
          git pull --rebase origin main || true
          git push origin HEAD:main
