name: Cleanup patch junk
on:
  workflow_dispatch:
jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Remove temporary patch files and dead workflows
        run: |
          set -e
          # Dead workflows (keep only ci.yml)
          KEEP_WF=".github/workflows/ci.yml"
          find .github/workflows -type f -name '*.yml' ! -path "$KEEP_WF" -print -delete || true

          # Temporary tools payloads / scripts
          rm -f tools/*.b64 tools/*.gz.b64 tools/*_b64* tools/*.py 2>/dev/null || true
          rm -rf tools/restore 2>/dev/null || true
          # Keep tools dir if empty
          mkdir -p tools
          echo "# retained — no temporary payloads" > tools/README.md

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git status
          git diff --staged --quiet && echo "nothing to commit" && exit 0
          git commit -m "chore: remove all temporary patch files and dead workflows"
          git pull --rebase origin main || true
          git push origin HEAD:main
