name: apply-engine-hotpath
on:
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply engine hotpath
        run: python3 tools/hotpath/apply_hotpath.py
      - name: Commit
        run: |
          git config user.name "KAYANSTOR"
          git config user.email "jarallhalkboudi@gmail.com"
          git add -A
          git diff --cached --quiet && echo No changes && exit 0
          git commit -m "perf(engine): hotpath — atomic reserve, category cache, provisional sellable"
          git push
