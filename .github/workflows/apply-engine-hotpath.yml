name: apply-engine-hotpath
on:
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply processor contacts identity
        run: python3 tools/contacts/apply_remaining.py
      - name: Commit
        run: |
          git config user.name "KAYANSTOR"
          git config user.email "jarallhalkboudi@gmail.com"
          git add -A
          git diff --cached --quiet && echo No changes && exit 0
          git commit -m "feat(identity): LocalTransferProcessor contacts-based provision + promote

- Phone in device contacts => CustomerStatus.active with contact name
- Phone not in contacts => CustomerStatus.provisional (ledger only)
- Later transfer promotes provisional when contacts match
- Wired via ContactDirectory"
          git push
