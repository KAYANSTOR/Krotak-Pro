name: High-contrast theme Tajawal
on:
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Write file
        run: |
          python3 << 'PY'
          import base64
          from pathlib import Path
          b64 = (
            ''
          )
          from pathlib import Path
          import base64
          Path('lib/ui/theme/net_theme.dart').write_bytes(base64.b64decode(b64))
          print('ok', Path('lib/ui/theme/net_theme.dart').stat().st_size)
          PY
      - name: Commit
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lib/ui/theme/net_theme.dart
          git commit -m "Fix: high-contrast theme + GoogleFonts Tajawal" || echo nochange
          git pull --rebase origin main || true
          git push origin HEAD:main
