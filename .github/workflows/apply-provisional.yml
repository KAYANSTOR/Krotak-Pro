name: apply-provisional-accounts
on:
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply provisional account phase
        run: python3 tools/apply_provisional.py
      - name: Commit
        run: |
          git config user.name "KAYANSTOR"
          git config user.email "jarallhalkboudi@gmail.com"
          git add -A
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "feat(accounts): provisional ledger accounts for unknown transfer phones (phase 1)"
          git push
