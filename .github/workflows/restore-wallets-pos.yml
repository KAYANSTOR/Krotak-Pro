name: Restore wallets POS screen
on:
  workflow_dispatch:
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Decode and restore wallets_pos_screen.dart
        run: |
          python3 << 'PY'
          import base64, gzip
          from pathlib import Path
          b64 = Path('tools/wallets_pos_full.b64').read_text().strip()
          raw = gzip.decompress(base64.b64decode(b64))
          Path('lib/ui/screens/wallets_pos_screen.dart').write_bytes(raw)
          print('restored', len(raw))
          assert b'class WalletsPosScreen' in raw
          assert b'sheetPalette' in raw or b'_editPos' in raw
          print('OK')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lib/ui/screens/wallets_pos_screen.dart
          git commit -m "fix(ui): restore full WalletsPosScreen (themed POS sheet)" || true
          git push origin HEAD:main
