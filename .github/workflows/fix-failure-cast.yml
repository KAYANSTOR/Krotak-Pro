name: Fix Failure cast
on:
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          set -e
          python3 -c "from pathlib import Path; p=Path('lib/domain/services/local_catalog_services.dart'); t=p.read_text(); t2=t.replace('return Failure(r.error)','return Failure((r as Failure).error)'); print('changed', t!=t2); p.write_text(t2)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lib/domain/services/local_catalog_services.dart
          git commit -m "Fix Failure(r.error) cast" || echo nochange
          git pull --rebase origin main || true
          git push origin HEAD:main
