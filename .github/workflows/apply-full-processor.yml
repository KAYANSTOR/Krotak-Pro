name: Apply full transfer processor
on:
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Assemble and write full processor + tests
        run: python3 tools/apply_full_processor.py
      - name: Commit restored files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/domain/services/local_transfer_processor.dart test/services/message_parser_and_transfer_test.dart
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "feat(transfer): full LocalTransferProcessor auto-provision + commercial path + tests"
          git push
