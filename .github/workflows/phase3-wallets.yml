name: Phase3 Wallets POS restore
on:
  workflow_dispatch:
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Restore wallets_pos_screen.dart
        run: |
          python3 << 'PY'
          import base64, gzip
          from pathlib import Path
          parts = sorted(Path('tools').glob('wallets_gz_p_*.b64'))
          print('parts found', [p.name for p in parts])
          gzb64 = ''.join(p.read_text().strip() for p in parts)
          print('b64 len', len(gzb64))
          raw = gzip.decompress(base64.b64decode(gzb64))
          Path('lib/ui/screens/wallets_pos_screen.dart').write_bytes(raw)
          print('restored', len(raw), 'bytes')
          assert b'class WalletsPosScreen' in raw
          print('OK')
          PY
      - name: Fix seeds video badges
        run: |
          python3 << 'PY'
          from pathlib import Path
          p = Path('lib/domain/services/local_catalog_services.dart')
          t = p.read_text()
          for a,b in [
            ("sourceMode: WalletSourceMode.notification, packageName: 'com.wecash.jawali'","sourceMode: WalletSourceMode.sms, packageName: 'com.wecash.jawali'"),
            ("sourceMode: WalletSourceMode.notification, packageName: 'com.one.onecustomer'","sourceMode: WalletSourceMode.sms, packageName: 'com.one.onecustomer'"),
            ("sourceMode: WalletSourceMode.notification, packageName: 'co.ysys.floosak'","sourceMode: WalletSourceMode.sms, packageName: 'co.ysys.floosak'"),
          ]:
            t = t.replace(a,b)
          p.write_text(t)
          print('seeds done')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lib/ui/screens/wallets_pos_screen.dart lib/domain/services/local_catalog_services.dart
          git commit -m "feat(wallets): Phase 3 complete — video-accurate Wallets/POS UI + SMS/notif seeds + POS phone" || true
          git push origin HEAD:main
