name: Apply auto-provision transfer patch
on:
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Download and apply patch scripts
        run: |
          python3 tools/apply_auto_provision_patch.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/domain/services/local_transfer_processor.dart test/services/message_parser_and_transfer_test.dart
          git status
          git commit -m "feat(transfer): auto-provision unknown phone customers from wallet transfers" || exit 0
          git push
