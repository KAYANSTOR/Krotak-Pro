name: Apply dashboard phase-1
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/dashboard_phase1.gz.b64'
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode and commit dashboard
        run: |
          set -e
          mkdir -p tools
          if [ ! -f tools/dashboard_phase1.gz.b64 ]; then
            echo "missing payload"
            exit 1
          fi
          base64 -d tools/dashboard_phase1.gz.b64 | gunzip > lib/ui/screens/dashboard_screen.dart
          grep -q '_MessageStatusCard' lib/ui/screens/dashboard_screen.dart
          grep -q 'GridView.count' lib/ui/screens/dashboard_screen.dart
          git config user.name "kayan-bot"
          git config user.email "bot@kayan.local"
          git add lib/ui/screens/dashboard_screen.dart
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "feat(dashboard): phase-1 complete — MessageStatusCard, danger banner, 2x2 actions, real data"
            git push
          fi
