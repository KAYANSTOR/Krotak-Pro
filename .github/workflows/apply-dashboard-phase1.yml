name: Apply dashboard phase-1
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/dashboard_phase1_*.b64'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Assemble decode and commit
        run: |
          set -e
          cat tools/dashboard_phase1_00.b64 tools/dashboard_phase1_01.b64 tools/dashboard_phase1_02.b64 tools/dashboard_phase1_03.b64 tools/dashboard_phase1_04.b64 | tr -d '\n' | base64 -d | gunzip > lib/ui/screens/dashboard_screen.dart
          wc -l lib/ui/screens/dashboard_screen.dart
          grep -q '_MessageStatusCard' lib/ui/screens/dashboard_screen.dart
          grep -q 'GridView.count' lib/ui/screens/dashboard_screen.dart
          grep -q 'NetAlertStyle.danger' lib/ui/screens/dashboard_screen.dart
          git config user.name "kayan-bot"
          git config user.email "bot@kayan.local"
          git add lib/ui/screens/dashboard_screen.dart
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "feat(dashboard): phase-1 complete"
            git push
          fi
