name: Apply dashboard phase1
on:
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Restore dashboard from gzip b64
        run: |
          python3 - <<'PY'
          import base64, gzip, pathlib
          b64 = pathlib.Path('tools/dashboard_phase1.dart.gz.b64').read_text().strip()
          data = gzip.decompress(base64.b64decode(b64))
          pathlib.Path('lib/ui/screens/dashboard_screen.dart').write_bytes(data)
          print('written', len(data))
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lib/ui/screens/dashboard_screen.dart
          git commit -m "feat(dashboard): phase-1 full screen matched to Z Net video" || exit 0
          git pull --rebase origin main || true
          git push origin HEAD:main
