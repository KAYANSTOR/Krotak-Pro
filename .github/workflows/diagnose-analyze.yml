name: Diagnose analyze failure

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.5'
          channel: stable
      - run: flutter pub get
      - name: Run analyze and capture output
        id: analyze
        continue-on-error: true
        run: |
          flutter analyze --no-fatal-infos > /tmp/analyze_out.txt 2>&1 || true
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
      - name: Post output as commit comment
        run: |
          BODY=$(tail -c 60000 /tmp/analyze_out.txt | python3 -c "import sys,json; print(json.dumps(sys.stdin.read()))")
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -d "{\"body\": $BODY}"
