name: Fix category create
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/fix_category.py'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 tools/fix_category.py
      - run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lib/ui/screens/inventory_sheets.dart
          git commit -m "Fix category create validation and keep sheet open" || echo nochange
          git pull --rebase origin main || true
          git push origin HEAD:main
