name: Fix category create
on:
  push:
    paths:
      - '.github/workflows/fix-category-create.yml'
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch _createCategory
        run: |
          python3 << 'PY'
          from pathlib import Path
          p = Path('lib/ui/screens/inventory_sheets.dart')
          t = p.read_text()
          old = 'if (name.isEmpty || major == null || major <= 0) return;'
          if old in t:
              t = t.replace(old, """if (name.isEmpty) {
      ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text('أدخل اسم الفئة', style: TextStyle(fontFamily: 'Tajawal'))));
      return;
    }
    if (major == null || major <= 0) {
      ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text('أدخل قيمة اسمية صحيحة أكبر من صفر', style: TextStyle(fontFamily: 'Tajawal'))));
      return;
    }""")
              print('validation fixed')
          # Keep sheet open after create
          t2 = t.replace(
              'await widget.onChanged();\n    if (context.mounted) Navigator.pop(context);',
              "ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text('تم إنشاء الفئة', style: const TextStyle(fontFamily: 'Tajawal'))));\n    await widget.onChanged();",
              1,
          )
          if t2 != t:
              print('pop fixed')
              t = t2
          else:
              print('pop pattern missing')
          p.write_text(t)
          print('size', p.stat().st_size)
          PY
      - name: Commit
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lib/ui/screens/inventory_sheets.dart
          git commit -m "Fix: category create validation and keep sheet open" || echo nochange
          git pull --rebase origin main || true
          git push origin HEAD:main
