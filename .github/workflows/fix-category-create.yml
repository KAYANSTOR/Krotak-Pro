name: Fix category create
on:
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch _createCategory
        run: |
          python3 << 'PY'
          from pathlib import Path
          p = Path('lib/ui/screens/inventory_sheets.dart')
          t = p.read_text()
          # Fix silent validation failure
          if "if (name.isEmpty || major == null || major <= 0) return;" in t:
              t = t.replace(
                  "if (name.isEmpty || major == null || major <= 0) return;",
                  """if (name.isEmpty) {
      ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text('أدخل اسم الفئة', style: TextStyle(fontFamily: 'Tajawal'))));
      return;
    }
    if (major == null || major <= 0) {
      ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text('أدخل قيمة اسمية صحيحة أكبر من صفر', style: TextStyle(fontFamily: 'Tajawal'))));
      return;
    }""",
              )
              print('validation fixed')
          # Don't pop categories sheet after create — keep it open
          old_pop = """    await widget.onChanged();
    if (context.mounted) Navigator.pop(context);
  }
}"""
          new_pop = """    ScaffoldMessenger.of(context).showSnackBar(
      SnackBar(content: Text('تم إنشاء الفئة «$name»', style: const TextStyle(fontFamily: 'Tajawal'))),
    );
    await widget.onChanged();
  }
}"""
          if old_pop in t:
              t = t.replace(old_pop, new_pop, 1)
              print('keep sheet open fixed')
          else:
              print('pop pattern not found')
              idx = t.find('await widget.onChanged()')
              print(repr(t[idx:idx+120]))
          # High-contrast dialog colors
          t = t.replace(
              "title: const Text('فئة جديدة', style: TextStyle(fontFamily: 'Tajawal')),",
              "title: const Text('فئة جديدة', style: TextStyle(fontFamily: 'Tajawal', fontWeight: FontWeight.w800, color: Color(0xFF1A202C))),",
          )
          p.write_text(t)
          print('done', p.stat().st_size)
          PY
      - name: Commit
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lib/ui/screens/inventory_sheets.dart
          git commit -m "Fix: category create validation + keep sheet + contrast" || echo nochange
          git pull --rebase origin main || true
          git push origin HEAD:main
