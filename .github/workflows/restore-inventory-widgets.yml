name: Restore inventory widgets
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/inv_p0.b64'
      - 'tools/inv_p1.b64'
      - 'tools/inv_p2.b64'
      - 'tools/inv_p3.b64'
      - 'tools/restore_inventory_widgets.py'
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Restore inventory_widgets.dart
        run: python3 tools/restore_inventory_widgets.py
      - name: Commit restored file
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lib/ui/screens/inventory_widgets.dart
          git diff --staged --quiet && echo "no change" && exit 0
          git commit -m "fix: restore full inventory_widgets (_CategoryChip _StatusChip _TicketCard)"
          git pull --rebase origin main || true
          git push origin HEAD:main
