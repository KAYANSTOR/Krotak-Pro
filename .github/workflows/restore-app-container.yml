name: Restore AppContainer
on:
  workflow_dispatch:
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Decode and commit AppContainer
        run: |
          base64 -d tools/app_container_impl.b64 > lib/application/app_container_impl.dart
          wc -l lib/application/app_container_impl.dart
          head -3 lib/application/app_container_impl.dart
          grep -n "backupDirectoryOverride != null" lib/application/app_container_impl.dart
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/application/app_container_impl.dart
          git commit -m "fix(bootstrap): restore AppContainer + skip path_provider when backup override set" || echo "no change"
          git push origin HEAD:main
