name: Restore catalog
on:
  workflow_dispatch:
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply catalog from known good local state via curl of gist - fallback inline
        run: |
          set -e
          cat > lib/domain/services/local_catalog_services.dart << 'ENDCATALOG'
PLACEHOLDER_WILL_REPLACE
ENDCATALOG
