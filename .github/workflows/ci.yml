name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.4
          cache: true
      - name: Install SQLite
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - run: flutter pub get
      - name: Flutter analyze
        run: flutter analyze --no-fatal-infos
      - name: Test (full suite)
        run: flutter test

  build-apk:
    needs: analyze-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.4
          cache: true
      - name: Install SQLite
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - run: flutter pub get
      # Phase 7: commercial release APKs are signed only from GitHub Secrets.
      # No fallback to android/signing/*.b64. Missing secrets fail the job.
      - name: Prepare keystore from GitHub Secrets
        env:
          APK_KEYSTORE_B64: ${{ secrets.APK_KEYSTORE_B64 }}
          APK_KEYSTORE_PASSWORD: ${{ secrets.APK_KEYSTORE_PASSWORD }}
          APK_KEY_PASSWORD: ${{ secrets.APK_KEY_PASSWORD }}
          APK_KEY_ALIAS: ${{ secrets.APK_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -z "${APK_KEYSTORE_B64}" ] || [ -z "${APK_KEYSTORE_PASSWORD}" ] || [ -z "${APK_KEY_PASSWORD}" ] || [ -z "${APK_KEY_ALIAS}" ]; then
            echo "Phase 7: missing signing secrets."
            echo "Required repository secrets: APK_KEYSTORE_B64, APK_KEYSTORE_PASSWORD, APK_KEY_PASSWORD, APK_KEY_ALIAS"
            echo "See docs/phase-7-ci-signing.md"
            exit 1
          fi
          mkdir -p android/app/keystore
          printf '%s' "${APK_KEYSTORE_B64}" | base64 -d > android/app/keystore/upload.jks
          {
            echo "storeFile=keystore/upload.jks"
            echo "storeType=PKCS12"
            echo "keyAlias=${APK_KEY_ALIAS}"
            echo "storePassword=${APK_KEYSTORE_PASSWORD}"
            echo "keyPassword=${APK_KEY_PASSWORD}"
          } > android/key.properties
      - name: Verify Flutter/Android toolchain
        run: |
          flutter --version
          java -version
          cd android
          ./gradlew --version

      - name: Build release APK
        run: flutter build apk --release
      - name: Scrub signing material
        if: always()
        run: |
          rm -f android/key.properties android/app/keystore/upload.jks
      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: krotak-pro-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: apk-${{ github.run_number }}
          name: Krotak Pro APK ${{ github.run_number }}
          body: "Release APK from CI run ${{ github.run_number }} (Secrets-only signing)"
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
