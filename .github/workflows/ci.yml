name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.4
          cache: true
      - name: Install SQLite
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - run: flutter pub get
      - name: Flutter analyze
        run: flutter analyze --no-fatal-infos
      - name: Test (full suite)
        run: flutter test

  build-apk:
    needs: analyze-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.4
          cache: true
      - run: flutter pub get
      # Signature stays stable across builds so a new APK installs directly on
      # top of the installed app (no "App not installed / package conflicts").
      # The key is the SAME committed key used locally (android/signing/*.b64),
      # so a CI APK also installs over a locally built APK. Set the
      # APK_KEYSTORE_B64 secret to rotate to a private key at any time.
      - name: Prepare stable upload keystore
        run: |
          mkdir -p android/app/keystore
          if [ -n "${{ secrets.APK_KEYSTORE_B64 }}" ]; then
            printf '%s' "${{ secrets.APK_KEYSTORE_B64 }}" | base64 -d \
              > android/app/keystore/net-upload.jks
          else
            base64 -d android/signing/net-upload.jks.b64 \
              > android/app/keystore/net-upload.jks
          fi
          {
            echo "storeFile=keystore/net-upload.jks"
            echo "storeType=PKCS12"
            echo "keyAlias=net-upload"
            echo "storePassword=netupload2026"
            echo "keyPassword=netupload2026"
          } > android/key.properties
      - name: Build release APK
        run: flutter build apk --release
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: net-flutter-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Net Flutter APK ${{ github.run_number }}
          body: "Release APK from CI run ${{ github.run_number }}"
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
