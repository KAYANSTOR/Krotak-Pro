name: CI

on:
  push:
    branches: [main, development/full-completion]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.4
          cache: true
      - name: Install SQLite
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - run: flutter pub get
      - name: Flutter analyze
        run: flutter analyze --no-fatal-infos
      - name: Test (full suite)
        run: flutter test

  build-apk:
    needs: analyze-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.4
          cache: true
      - run: flutter pub get
      - name: Require GitHub signing secrets
        env:
          APK_KEYSTORE_B64: ${{ secrets.APK_KEYSTORE_B64 }}
          APK_KEYSTORE_PASSWORD: ${{ secrets.APK_KEYSTORE_PASSWORD }}
          APK_KEY_PASSWORD: ${{ secrets.APK_KEY_PASSWORD }}
          APK_KEY_ALIAS: ${{ secrets.APK_KEY_ALIAS }}
        run: |
          missing=0
          for name in APK_KEYSTORE_B64 APK_KEYSTORE_PASSWORD APK_KEY_PASSWORD APK_KEY_ALIAS; do
            eval "value=\${$name}"
            if [ -z "$value" ]; then
              echo "Missing required secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Phase 7: CI must sign with GitHub Secrets only."
            echo "Add APK_KEYSTORE_B64, APK_KEYSTORE_PASSWORD, APK_KEY_PASSWORD, APK_KEY_ALIAS."
            exit 1
          fi
      - name: Prepare upload keystore from secrets
        env:
          APK_KEYSTORE_B64: ${{ secrets.APK_KEYSTORE_B64 }}
          APK_KEYSTORE_PASSWORD: ${{ secrets.APK_KEYSTORE_PASSWORD }}
          APK_KEY_PASSWORD: ${{ secrets.APK_KEY_PASSWORD }}
          APK_KEY_ALIAS: ${{ secrets.APK_KEY_ALIAS }}
        run: |
          set -euo pipefail
          mkdir -p android/app/keystore
          printf '%s' "$APK_KEYSTORE_B64" | base64 -d > android/app/keystore/upload.jks
          umask 077
          {
            echo "storeFile=keystore/upload.jks"
            echo "storeType=PKCS12"
            echo "keyAlias=$APK_KEY_ALIAS"
            echo "storePassword=$APK_KEYSTORE_PASSWORD"
            echo "keyPassword=$APK_KEY_PASSWORD"
          } > android/key.properties
          chmod 600 android/key.properties android/app/keystore/upload.jks
      - name: Build release APK
        run: flutter build apk --release
      - name: Wipe signing material
        if: always()
        run: |
          rm -f android/key.properties android/app/keystore/upload.jks
          rm -rf android/app/keystore
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: krotak-pro-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Krotak Pro APK ${{ github.run_number }}
          body: "Release APK from CI run ${{ github.run_number }}"
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
