name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.4
          cache: true
      - name: Install SQLite
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - run: flutter pub get
      - name: Flutter analyze
        run: flutter analyze --no-fatal-infos
      - name: Test (full suite)
        run: flutter test

  build-apk:
    needs: analyze-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.4
          cache: true
      - run: flutter pub get

      - name: Assert no private signing material is tracked
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)(key\.properties|.*\.jks|.*\.keystore)$|^android/signing/' >/dev/null; then
            echo "Private signing material must never be committed."
            git ls-files | grep -E '(^|/)(key\.properties|.*\.jks|.*\.keystore)$|^android/signing/' || true
            exit 1
          fi

      - name: Verify release signing secrets
        env:
          APK_KEYSTORE_B64: ${{ secrets.APK_KEYSTORE_B64 }}
          APK_KEYSTORE_PASSWORD: ${{ secrets.APK_KEYSTORE_PASSWORD }}
          APK_KEY_PASSWORD: ${{ secrets.APK_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$APK_KEYSTORE_B64" || { echo "Missing secret: APK_KEYSTORE_B64"; exit 1; }
          test -n "$APK_KEYSTORE_PASSWORD" || { echo "Missing secret: APK_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$APK_KEY_PASSWORD" || { echo "Missing secret: APK_KEY_PASSWORD"; exit 1; }

      - name: Prepare release keystore
        env:
          APK_KEYSTORE_B64: ${{ secrets.APK_KEYSTORE_B64 }}
          APK_KEYSTORE_PASSWORD: ${{ secrets.APK_KEYSTORE_PASSWORD }}
          APK_KEY_PASSWORD: ${{ secrets.APK_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android/app/keystore
          printf '%s' "$APK_KEYSTORE_B64" | base64 --decode > android/app/keystore/net-upload.jks
          chmod 600 android/app/keystore/net-upload.jks
          cat > android/key.properties <<EOF
          storeFile=keystore/net-upload.jks
          storeType=PKCS12
          keyAlias=net-upload
          storePassword=$APK_KEYSTORE_PASSWORD
          keyPassword=$APK_KEY_PASSWORD
          EOF
          chmod 600 android/key.properties
          test -s android/app/keystore/net-upload.jks

      - name: Build release APK
        run: flutter build apk --release

      - name: Create SHA-256 checksum
        shell: bash
        run: sha256sum build/app/outputs/flutter-apk/app-release.apk > build/app/outputs/flutter-apk/app-release.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: net-flutter-release-apk
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-release.apk.sha256
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Net Flutter APK ${{ github.run_number }}
          body: |
            Release APK generated by CI.

            Distribution channel currently: direct APK.
            SHA-256 is published in app-release.apk.sha256.
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-release.apk.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
