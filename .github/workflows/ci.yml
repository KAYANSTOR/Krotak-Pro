name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install SQLite (required by Drift native tests)
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - name: Pub get
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Unit tests
        run: flutter test
