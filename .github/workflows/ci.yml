name: CI

concurrency:
  group: krotak-pro-ci
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          cache: true
      - name: Install SQLite
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - run: flutter pub get
      - name: Flutter analyze
        run: flutter analyze --no-fatal-infos
      - name: Test (full suite)
        run: flutter test

  build-apk:
    needs: analyze-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          cache: true
      - run: flutter pub get
      - name: Prepare stable keystore from GitHub Secrets
        id: stable-signing
        if: github.event_name != 'pull_request'
        env:
          APK_KEYSTORE_B64: ${{ secrets.APK_KEYSTORE_B64 }}
          APK_KEYSTORE_PASSWORD: ${{ secrets.APK_KEYSTORE_PASSWORD }}
          APK_KEY_PASSWORD: ${{ secrets.APK_KEY_PASSWORD }}
          APK_KEY_ALIAS: ${{ secrets.APK_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -z "${APK_KEYSTORE_B64}" ] || [ -z "${APK_KEYSTORE_PASSWORD}" ] || [ -z "${APK_KEY_PASSWORD}" ] || [ -z "${APK_KEY_ALIAS}" ]; then
            echo "mode=validation" >> "${GITHUB_OUTPUT}"
            echo "Commercial signing secrets are not configured; using disposable CI validation signing."
            exit 0
          fi
          mkdir -p android/app/keystore
          printf '%s' "${APK_KEYSTORE_B64}" | base64 -d > android/app/keystore/upload.jks
          {
            echo "storeFile=keystore/upload.jks"
            echo "storeType=PKCS12"
            echo "keyAlias=${APK_KEY_ALIAS}"
            echo "storePassword=${APK_KEYSTORE_PASSWORD}"
            echo "keyPassword=${APK_KEY_PASSWORD}"
          } > android/key.properties
          echo "mode=stable" >> "${GITHUB_OUTPUT}"

      - name: Prepare disposable validation keystore
        if: github.event_name == 'pull_request' || steps.stable-signing.outputs.mode != 'stable'
        run: |
          set -euo pipefail
          mkdir -p android/app/keystore
          keytool -genkeypair -noprompt             -alias ci-validation             -keyalg RSA             -keysize 2048             -validity 2             -keystore android/app/keystore/upload.jks             -storetype PKCS12             -storepass ci-validation-store             -keypass ci-validation-store             -dname "CN=Krotak Pro CI Validation, OU=CI, O=Krotak Pro, L=CI, ST=CI, C=US"
          {
            echo "storeFile=keystore/upload.jks"
            echo "storeType=PKCS12"
            echo "keyAlias=ci-validation"
            echo "storePassword=ci-validation-store"
            echo "keyPassword=ci-validation-store"
          } > android/key.properties
      - name: Build release APK
        run: flutter build apk --release
      - name: Scrub signing material
        if: always()
        run: |
          rm -f android/key.properties android/app/keystore/upload.jks
      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.stable-signing.outputs.mode == 'stable' && 'krotak-pro-release-apk' || 'krotak-pro-validation-apk' }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
      - name: Authenticate to Google Cloud (Firebase)
        if: github.event_name != 'pull_request' && env.FIREBASE_APP_ID != ''
        id: gcp-auth
        continue-on-error: true
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_CREDENTIALS }}
      - name: Distribute APK to Firebase App Distribution
        id: fad
        if: github.event_name != 'pull_request' && env.FIREBASE_APP_ID != '' && steps.gcp-auth.outcome == 'success'
        continue-on-error: true
        env:
          FIREBASE_GROUPS: ${{ secrets.FIREBASE_GROUPS }}
          FIREBASE_TESTERS: ${{ secrets.FIREBASE_TESTERS }}
          RELEASE_NOTES: ${{ github.event.head_commit.message }}
        run: |
          set +e
          npm install -g firebase-tools > /tmp/fad.log 2>&1
          args=(--app "$FIREBASE_APP_ID" --release-notes "$RELEASE_NOTES")
          [ -n "$FIREBASE_GROUPS" ] && args+=(--groups "$FIREBASE_GROUPS")
          [ -n "$FIREBASE_TESTERS" ] && args+=(--testers "$FIREBASE_TESTERS")
          firebase appdistribution:distribute build/app/outputs/flutter-apk/app-release.apk "${args[@]}" >> /tmp/fad.log 2>&1
          rc=$?
          msg=$(tail -c 3000 /tmp/fad.log | tr '\n' ' ' | sed 's/%/%25/g')
          echo "::notice title=AppDistribution exit=$rc::$msg"
          exit $rc
      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && steps.stable-signing.outputs.mode == 'stable'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: apk-${{ github.run_number }}
          name: Krotak Pro APK ${{ github.run_number }}
          body: "Release APK from CI run ${{ github.run_number }} (Secrets-only signing)"
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up gcloud
        if: github.event_name != 'pull_request' && env.FIREBASE_PROJECT_ID != '' && steps.gcp-auth.outcome == 'success'
        continue-on-error: true
        uses: google-github-actions/setup-gcloud@v2
      - name: Firebase Test Lab (Robo test)
        id: testlab
        if: github.event_name != 'pull_request' && env.FIREBASE_PROJECT_ID != '' && steps.gcp-auth.outcome == 'success'
        continue-on-error: true
        env:
          TESTLAB_DEVICE: ${{ vars.TESTLAB_DEVICE || 'model=MediumPhone.arm,version=34,locale=ar,orientation=portrait' }}
        run: |
          set +e
          {
            gcloud firebase test android models list --filter="form=VIRTUAL" --format="value(codename,supportedVersionIds)" | head -20
            gcloud firebase test android run \
              --project "$FIREBASE_PROJECT_ID" \
              --type robo \
              --app build/app/outputs/flutter-apk/app-release.apk \
              --device "$TESTLAB_DEVICE" \
              --timeout 5m
          } > /tmp/testlab.log 2>&1
          rc=$?
          msg=$(tail -c 3500 /tmp/testlab.log | tr '\n' ' ' | sed 's/%/%25/g')
          echo "::notice title=TestLab exit=$rc::$msg"
          exit $rc
      - name: Report Firebase step outcomes
        if: always() && env.FIREBASE_APP_ID != ''
        run: |
          echo "::notice title=Firebase outcomes::app-distribution=${{ steps.fad.outcome }} test-lab=${{ steps.testlab.outcome }}"
