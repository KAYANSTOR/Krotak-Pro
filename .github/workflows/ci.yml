name: CI

concurrency:
  group: krotak-pro-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, development/full-completion]
  pull_request:
    branches: [main, development/full-completion]
  workflow_dispatch:

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          cache: true
      - name: Install SQLite
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - run: flutter pub get
      - name: Flutter analyze
        run: flutter analyze --no-fatal-infos
      - name: Test (full suite)
        run: flutter test
      - name: Android unit tests (native SMS inbox layer)
        # `flutter test` لا ينفّذ شيئًا من Kotlin. هذه الاختبارات تغطي منطق
        # SmsInboxQueue/SmsInboxStore/SmsReceiver على JVM بلا محاكي، وتحتاج
        # Gradle wrapper الذي يولّده --config-only (الملف غير ملتزم بالمستودع).
        run: |
          set -euo pipefail
          flutter build apk --config-only
          cd android
          ./gradlew :app:testDebugUnitTest --no-daemon --console=plain
      - name: Upload Android unit test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-unit-tests
          path: build/app/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

  build-apk:
    needs: analyze-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Required by google-github-actions/auth (workload identity federation) and
      # by any gcloud/Firebase step that exchanges an OIDC token.
      id-token: write
    env:
      FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      # Firebase distribution and Test Lab only run for releases, so dev-branch
      # runs keep a real static gate without spending Test Lab quota.
      FIREBASE_RELEASE_RUN: ${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          cache: true
      - run: flutter pub get
      - name: Prepare stable keystore from GitHub Secrets
        id: stable-signing
        if: github.event_name != 'pull_request'
        env:
          APK_KEYSTORE_B64: ${{ secrets.APK_KEYSTORE_B64 }}
          APK_KEYSTORE_PASSWORD: ${{ secrets.APK_KEYSTORE_PASSWORD }}
          APK_KEY_PASSWORD: ${{ secrets.APK_KEY_PASSWORD }}
          APK_KEY_ALIAS: ${{ secrets.APK_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -z "${APK_KEYSTORE_B64}" ] || [ -z "${APK_KEYSTORE_PASSWORD}" ] || [ -z "${APK_KEY_PASSWORD}" ] || [ -z "${APK_KEY_ALIAS}" ]; then
            echo "mode=validation" >> "${GITHUB_OUTPUT}"
            echo "Commercial signing secrets are not configured; using disposable CI validation signing."
            exit 0
          fi
          mkdir -p android/app/keystore
          printf '%s' "${APK_KEYSTORE_B64}" | base64 -d > android/app/keystore/upload.jks
          {
            echo "storeFile=keystore/upload.jks"
            echo "storeType=PKCS12"
            echo "keyAlias=${APK_KEY_ALIAS}"
            echo "storePassword=${APK_KEYSTORE_PASSWORD}"
            echo "keyPassword=${APK_KEY_PASSWORD}"
          } > android/key.properties
          echo "mode=stable" >> "${GITHUB_OUTPUT}"

      - name: Prepare disposable validation keystore
        if: github.event_name == 'pull_request' || steps.stable-signing.outputs.mode != 'stable'
        run: |
          set -euo pipefail
          mkdir -p android/app/keystore
          keytool -genkeypair -noprompt             -alias ci-validation             -keyalg RSA             -keysize 2048             -validity 2             -keystore android/app/keystore/upload.jks             -storetype PKCS12             -storepass ci-validation-store             -keypass ci-validation-store             -dname "CN=Krotak Pro CI Validation, OU=CI, O=Krotak Pro, L=CI, ST=CI, C=US"
          {
            echo "storeFile=keystore/upload.jks"
            echo "storeType=PKCS12"
            echo "keyAlias=ci-validation"
            echo "storePassword=ci-validation-store"
            echo "keyPassword=ci-validation-store"
          } > android/key.properties
      - name: Build release APK
        run: flutter build apk --release
      - name: Verify the APK is really signed
        run: |
          set -euo pipefail
          apk=build/app/outputs/flutter-apk/app-release.apk
          test -f "$apk"
          sdk="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          apksigner="$(command -v apksigner || true)"
          if [ -z "$apksigner" ]; then
            apksigner="$sdk/build-tools/$(ls "$sdk/build-tools" | sort -V | tail -1)/apksigner"
          fi
          "$apksigner" verify --verbose --print-certs "$apk"
      - name: Scrub signing material
        if: always()
        run: |
          rm -f android/key.properties android/app/keystore/upload.jks
      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.stable-signing.outputs.mode == 'stable' && 'krotak-pro-release-apk' || 'krotak-pro-validation-apk' }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      # ---------------------------------------------------------------
      # Firebase: App Distribution + Test Lab.
      #
      # These steps are a hard gate. They run ONLY for a release run, and a
      # failure fails the job, so the GitHub Release below cannot be published
      # while Test Lab is red. They also deliberately run BEFORE the release so
      # a broken build is never published.
      # ---------------------------------------------------------------
      - name: Authenticate to Google Cloud (Firebase)
        if: env.FIREBASE_RELEASE_RUN == 'true' && env.FIREBASE_APP_ID != ''
        id: gcp-auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_CREDENTIALS }}

      - name: Set up gcloud
        if: steps.gcp-auth.outcome == 'success'
        id: gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Enable required Google APIs
        if: steps.gcp-auth.outcome == 'success'
        run: |
          set -euo pipefail
          gcloud services enable \
            toolresults.googleapis.com \
            testing.googleapis.com \
            firebaseappdistribution.googleapis.com \
            --project "$FIREBASE_PROJECT_ID"
          gcloud services list --enabled --project "$FIREBASE_PROJECT_ID" \
            --filter="config.name:(testing.googleapis.com OR toolresults.googleapis.com OR firebaseappdistribution.googleapis.com)" \
            --format="value(config.name)"

      - name: Provision the Test Lab results bucket
        if: steps.gcp-auth.outcome == 'success'
        id: results
        env:
          TESTLAB_RESULTS_BUCKET: ${{ vars.TESTLAB_RESULTS_BUCKET }}
        run: |
          set -euo pipefail
          bucket="${TESTLAB_RESULTS_BUCKET:-$FIREBASE_PROJECT_ID-test-results}"
          if ! gcloud storage buckets describe "gs://$bucket" --project "$FIREBASE_PROJECT_ID" >/dev/null 2>&1; then
            gcloud storage buckets create "gs://$bucket" \
              --project "$FIREBASE_PROJECT_ID" \
              --location=us-central1 \
              --uniform-bucket-level-access
          fi
          # Test Lab needs to be able to write results into its own bucket.
          gcloud storage buckets add-iam-policy-binding "gs://$bucket" \
            --member="serviceAccount:service-$FIREBASE_PROJECT_ID@gcp-sa-firebase.iam.gserviceaccount.com" \
            --role="roles/storage.objectAdmin" >/dev/null 2>&1 || true
          echo "bucket=$bucket" >> "$GITHUB_OUTPUT"

      - name: Distribute APK to Firebase App Distribution
        if: steps.gcp-auth.outcome == 'success' && env.FIREBASE_APP_ID != ''
        id: fad
        env:
          FIREBASE_GROUPS: ${{ secrets.FIREBASE_GROUPS }}
          FIREBASE_TESTERS: ${{ secrets.FIREBASE_TESTERS }}
          RELEASE_NOTES: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          npm install -g firebase-tools
          args=(--app "$FIREBASE_APP_ID" --release-notes "$RELEASE_NOTES")
          if [ -n "${FIREBASE_GROUPS:-}" ]; then args+=(--groups "$FIREBASE_GROUPS"); fi
          if [ -n "${FIREBASE_TESTERS:-}" ]; then args+=(--testers "$FIREBASE_TESTERS"); fi
          firebase appdistribution:distribute build/app/outputs/flutter-apk/app-release.apk "${args[@]}"

      - name: Firebase Test Lab (Robo test)
        if: steps.gcp-auth.outcome == 'success' && env.FIREBASE_PROJECT_ID != ''
        id: testlab
        env:
          TESTLAB_DEVICE: ${{ vars.TESTLAB_DEVICE || 'model=MediumPhone.arm,version=34,locale=ar,orientation=portrait' }}
        run: |
          set -euo pipefail
          gcloud firebase test android run --quiet \
            --project "$FIREBASE_PROJECT_ID" \
            --type robo \
            --app build/app/outputs/flutter-apk/app-release.apk \
            --device "$TESTLAB_DEVICE" \
            --results-bucket "gs://${{ steps.results.outputs.bucket }}" \
            --timeout 5m

      - name: Report Firebase step outcomes
        if: always() && env.FIREBASE_RELEASE_RUN == 'true' && env.FIREBASE_APP_ID != ''
        run: |
          echo "::notice title=Firebase outcomes::app-distribution=${{ steps.fad.outcome }} test-lab=${{ steps.testlab.outcome }}"

      - name: Publish GitHub Release
        if: >-
          github.ref == 'refs/heads/main'
          && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
          && steps.stable-signing.outputs.mode == 'stable'
          && (steps.testlab.outcome == 'success' || steps.testlab.outcome == 'skipped')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: apk-${{ github.run_number }}
          name: Krotak Pro APK ${{ github.run_number }}
          body: "Release APK from CI run ${{ github.run_number }} (Secrets-only signing; Firebase Test Lab ${{ steps.testlab.outcome }})"
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
